[package]
name = "octo-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The audio engine for the Octo desktop app: decoding, gapless, crossfade, sound shaping and output."
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "octo_audio"
crate-type = ["cdylib", "rlib"]

[[bin]]
# Writes the Kotlin bindings from the built library.
name = "uniffi-bindgen"
path = "tools/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["opus"]
# Opus through a pure Rust decoder.
opus = ["dep:opus-decoder", "dep:symphonia-core"]
# Only for the binding generator.
bindgen = ["uniffi/cli"]

[dependencies]
# id3v2 and ape read the tags MP3 files carry (ReplayGain, tempo).
symphonia = { version = "0.6.1", default-features = false, features = [
    "flac", "mp3", "aac", "isomp4", "alac", "vorbis", "ogg", "wav", "aiff", "pcm", "opt-simd", "id3v2", "ape",
] }
opus-decoder = { version = "0.1.1", optional = true }
# Named directly for the codec registration macro.
symphonia-core = { version = "0.6.1", optional = true }
cpal = { version = "0.18.2", features = ["realtime"] }
rubato = "5.0.0"
rtrb = "0.4.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
# The same TLS ureq uses, named directly to check a server's certificate
# the system's way first and then against the ones the listener trusted.
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring"] }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
# For a certificate's SHA-256 fingerprint.
ring = { version = "0.17.14", default-features = false }
crossbeam-channel = "0.5.17"
thiserror = "2.0.21"
log = "0.4.34"
uniffi = "0.32.2"

# Animated covers are decoded by the system: Media Foundation on Windows,
# AVFoundation on macOS, GStreamer on Linux (loaded when asked, so the
# engine still loads where it is missing).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
    "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std", "CMSampleBuffer", "CMTime", "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libloading = "0.9.0"

[dev-dependencies]
# Reads the shared automix test vectors.
serde_json = "1.0.151"
flacenc = "0.5.1"
# Makes self-signed certificates for the HTTPS test server.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[profile.release]
lto = "thin"
codegen-units = 4
